<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3c2217">
<title>Perfume Wardrobe</title>
<style>@font-face{font-family:'Jost';font-weight:300;font-style:normal;font-display:swap;src:url(fonts/jost-latin-300-normal.woff2) format('woff2')}@font-face{font-family:'Jost';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Jost';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'DM Serif Display';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/dm-serif-display-latin-400-normal.woff2) format('woff2')}
/* Layout: a walnut cabinet of lit shelves; tapping a bottle slides up its detail card. */
:root{
  --page:#efe7e1; --ink:#2a1b16; --ink-soft:#6f5a52;
  --wood:#5a3524; --wood-deep:#3c2217; --wood-edge:#7a4a33;
  --brass:#b98a3e; --brass-soft:#d9b46a;
  --back:#f3e4d0; --back-shade:#e2c9a8;
  --card:#fbf6f1; --line:#e3d5ca; --chip:#f1e5da;
  --bar:#e8dacd; --label:#2a1b16;
  --display:'DM Serif Display',Georgia,serif; --body:'Jost',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1a1210; --ink:#f3e8df; --ink-soft:#b9a69b;
  --wood:#4a2b1d; --wood-deep:#2b1810; --wood-edge:#69402c;
  --back:#3a2a1e; --back-shade:#2a1d14;
  --card:#241a16; --line:#3d2e27; --chip:#33261f; --bar:#3a2c25; --label:#f3e8df; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#1a1210; --ink:#f3e8df; --ink-soft:#b9a69b;
  --wood:#4a2b1d; --wood-deep:#2b1810; --wood-edge:#69402c;
  --back:#3a2a1e; --back-shade:#2a1d14;
  --card:#241a16; --line:#3d2e27; --chip:#33261f; --bar:#3a2c25; --label:#f3e8df; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:760px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.count{color:var(--ink-soft);font-weight:300}

.cabinet{background:linear-gradient(90deg,var(--wood-deep),var(--wood) 6%,var(--wood) 94%,var(--wood-deep));padding:16px 14px 22px;border-radius:6px 6px 3px 3px;border:1px solid var(--wood-edge);box-shadow:0 18px 34px -18px rgba(0,0,0,.55);position:relative}
.cabinet::before{content:"";display:block;height:6px;margin:-16px -14px 14px;background:var(--brass);border-radius:5px 5px 0 0;opacity:.9}
.shelf{position:relative;background:linear-gradient(180deg,var(--back-shade),var(--back) 40%);padding:8px 8px 0;margin-bottom:0;box-shadow:inset 0 10px 14px -10px rgba(0,0,0,.45),inset 8px 0 10px -8px rgba(0,0,0,.35),inset -8px 0 10px -8px rgba(0,0,0,.35)}
.shelf+.shelf{margin-top:0}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end}
.plank{height:4px;background:linear-gradient(180deg,var(--wood-edge),var(--wood-deep));border-top:2px solid var(--brass-soft);box-shadow:0 2px 3px -2px rgba(0,0,0,.5)}
.plates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:1px 8px 7px;background:linear-gradient(180deg,var(--wood-deep),var(--wood))}
.plate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:0;padding:2px 3px;background:linear-gradient(180deg,#e0bd77,#b98a3e);color:#2a1b16;border:0;border-radius:3px;font:inherit;cursor:pointer;text-align:center;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 3px rgba(0,0,0,.4)}
.plate b,.plate small{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plate b{font-weight:500;font-size:10px;line-height:1.15}
.plate small{font-size:9px;line-height:1.15;opacity:.8}.plate small:empty{display:none}
.plate:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.plate.ghost{visibility:hidden}.plate{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button.bottle{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.drag-ghost{position:fixed;z-index:30;pointer-events:none;height:96px;width:auto;filter:drop-shadow(0 12px 12px rgba(0,0,0,.5));transform:translate(-50%,-70%) rotate(-4deg)}
.dragging{opacity:.35}.drop-t img,.drop-t.plate{outline:2px dashed var(--brass);outline-offset:2px;border-radius:6px}body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}.reset{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer;padding:0;margin-left:6px}
button.bottle{position:relative;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;width:100%;min-width:0;height:106px;color:inherit}
button.bottle::before{content:"";position:absolute;inset:-4% -12% -6%;background:radial-gradient(closest-side,rgba(255,226,180,.34),rgba(255,226,180,0));pointer-events:none}
button.bottle.glass::before{background:radial-gradient(closest-side,rgba(255,232,196,.6),rgba(255,232,196,0))}button.bottle.glass img{filter:drop-shadow(0 0 1px rgba(255,255,255,.85)) drop-shadow(0 6px 5px rgba(20,8,4,.45))}
button.bottle img{position:relative;height:104px;width:86%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 .6px rgba(255,255,255,.55)) drop-shadow(0 6px 5px rgba(20,8,4,.45));transition:transform .25s ease}
button.bottle img.wide{height:auto;max-height:104px;width:90%;max-width:none}
button.bottle:hover img,button.bottle:focus-visible img{transform:translateY(-6px)}
button.bottle:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.empty{height:104px;visibility:hidden}
.hint{margin:16px 2px 0;color:var(--ink-soft);font-size:13px}

/* detail card */
.scrim{position:fixed;inset:0;background:rgba(20,10,6,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:92%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--brass)}
.sheet.on{transform:none}
.sheet-in{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.close{position:sticky;top:0;align-self:flex-end;background:var(--chip);color:var(--ink);border:0;border-radius:99px;width:36px;height:36px;font-size:18px;cursor:pointer;margin-bottom:-20px;z-index:2}
.hd{display:flex;gap:16px;align-items:flex-end}
.hd img{height:170px;max-width:34%;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(60,34,23,.3))}
.hd h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,6.5vw,34px);line-height:1.08;margin:0 0 4px;text-wrap:balance}
.brand{color:var(--ink-soft)}
.rate{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.rate b{font-weight:400;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.stars{color:var(--brass);letter-spacing:2px}
.votes{color:var(--ink-soft);font-size:13px;font-variant-numeric:tabular-nums}
h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--ink-soft);margin:0 0 10px}
.acc{display:flex;flex-direction:column;gap:6px}
.acc div{height:30px;border-radius:5px;display:flex;align-items:center;padding-inline:10px;font-size:13px;font-weight:500;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);min-width:0}
.acc div.lt{color:#2a1b16;text-shadow:none}
.pyr{display:flex;flex-direction:column;gap:10px}
.tier{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.tier:first-child{border-top:0;padding-top:0}
.tier b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding-top:5px}
.tier div{display:flex;flex-wrap:wrap;gap:6px}
.tier span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.ab-sub{margin:0 0 10px;font-size:13px;color:var(--ink-soft)}.ab-picks{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:12px;padding:8px;background:var(--chip);border-radius:10px}.ab-picks>span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);width:100%}
.ab-sug{display:flex;flex-direction:column}.sg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--line)}.sg:first-child{border-top:0}
.sg-n{font-family:var(--display);font-size:20px;color:var(--ink-soft);line-height:1.1}.sg-t{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}.sg-t b{font-weight:500}.sg-t span{font-size:12px;color:var(--ink-soft)}
.sg-f{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;margin:6px 0 4px}.sg-f .t{height:8px;border-radius:99px;background:var(--bar);overflow:hidden}.sg-f .t i{display:block;height:100%;background:var(--brass);border-radius:99px}.sg-f>span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.dots{display:flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}.sg-w{font-size:13px;line-height:1.4}.sg-l{display:inline-block;margin-top:4px;font-size:12px;color:var(--ink);text-underline-offset:2px}
.ab-row{display:grid;grid-template-columns:112px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.ab-row .t{height:10px;border-radius:99px;background:var(--bar);overflow:hidden}.ab-row .t i{display:block;height:100%;border-radius:99px}
.ab-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.ab-list{display:flex;flex-direction:column;gap:8px}
.ab-read{font-family:var(--display);font-size:clamp(19px,5vw,23px);line-height:1.35;text-wrap:pretty}
.ab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ab-stat{background:var(--chip);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ab-stat b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;overflow-wrap:anywhere}.ab-stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}.ab-stat small{font-size:12px;color:var(--ink-soft)}
.ab-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.ab-n{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}.ab-n img{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}.ab-n em{font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums}.ab-n .ph{width:34px;height:34px;border-radius:8px;background:var(--chip);border:1px solid var(--line)}
button.ab-row,button.ab-n,button.ab-stat,.dn>[data-g]{font:inherit;color:inherit;text-align:left;cursor:pointer;border:0;background:none;width:100%;border-radius:8px}
button.ab-row{padding:4px 6px;margin-inline:-6px;width:calc(100% + 12px)}button.ab-n{padding:3px 4px;margin:-3px -4px;width:calc(100% + 8px);background:none}button.ab-stat{background:var(--chip)}
button.ab-row:hover,button.ab-n:hover{background:var(--chip)}button.on{outline:2px solid var(--brass);outline-offset:1px}
button.ab-row:focus-visible,button.ab-n:focus-visible,button.ab-stat:focus-visible,.ab-b:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dn>[data-g]{cursor:pointer;width:auto}
.ab-pop{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--chip);border:1px solid var(--line);border-radius:10px;margin:2px 0 4px}
.ab-b{display:flex;flex-direction:column;align-items:center;gap:2px;width:62px;background:none;border:0;border-radius:8px;padding:4px 2px;font:inherit;color:inherit;cursor:pointer}
.ab-b:hover{background:var(--card)}.ab-b img{height:54px;width:auto;max-width:56px;object-fit:contain}.ab-b span{font-size:10px;line-height:1.15;text-align:center;overflow-wrap:anywhere}.ab-b em{font-style:normal;font-size:10px;color:var(--ink-soft)}
.back{align-self:flex-start;background:none;border:1px solid var(--brass);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px}
.note img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--chip);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-weight:400;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.meter{display:flex;flex-direction:column;gap:8px}
.m{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;border-radius:99px;background:var(--bar);overflow:hidden}
.fill{height:100%;border-radius:99px}
.pct{color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
.dn{display:flex;height:30px;border-radius:6px;overflow:hidden;font-size:13px;font-weight:500}
.dn div{display:flex;align-items:center;justify-content:center}
.src{font-size:12px;color:var(--ink-soft)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}.switch{display:inline-flex;border:1px solid var(--brass);border-radius:99px;overflow:hidden}.switch button{background:none;border:0;color:var(--ink);font:inherit;font-size:13px;padding:7px 16px;cursor:pointer}.switch button[aria-pressed="true"]{background:var(--brass);color:#2a1b16}.switch button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.valbtn{align-self:flex-start;background:none;color:var(--ink);border:1px solid var(--brass);border-radius:99px;padding:7px 16px;font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer}
.valbtn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.tools .valbtn{margin-top:0}
.price{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.price>div{display:flex;flex-direction:column;gap:2px}
.price [hidden]{display:none!important}.valbtn[hidden]{display:none}
.price .amt{font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.price .amt s{font-family:var(--body);font-size:15px;color:var(--ink-soft);margin-left:8px}
.price .meta{font-size:13px;color:var(--ink-soft)}
.price a{color:var(--ink);font-size:13px}
.price.none .amt{font-size:20px;color:var(--ink-soft)}
.total{font-family:var(--display);font-size:clamp(34px,10vw,48px);line-height:1.05;font-variant-numeric:tabular-nums}
.vrows{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow img{width:36px;height:44px;object-fit:contain;object-position:center}
.vrow .n{min-width:0;font-size:14px}
.vrow .n small{display:block;color:var(--ink-soft);font-size:12px}
.vrow .p{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.vrow .p.na{color:var(--ink-soft);font-weight:300}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:560px){button.bottle{height:138px}button.bottle img,.empty{height:136px}button.bottle img.wide{max-height:136px}.plate b{font-size:12px}.plate small{font-size:11px}.hd img{height:210px}}
.ly{padding:12px 0;border-top:1px solid var(--line)}
.ly:first-of-type{border-top:0}
.ly-p{display:flex;align-items:flex-end;gap:2px;margin-bottom:6px}
.ly-p .ab-b{width:76px}
.ly-p .ab-b img{height:66px;max-width:68px}
.ly-p .ab-b.me{background:var(--chip)}
.ly-p .ab-b em{color:var(--brass);font-weight:500;font-size:11px}
.ly-p .plus{font-style:normal;color:var(--ink-soft);padding:0 2px 26px;font-size:18px}

.gb{position:absolute;top:0;left:1px;z-index:2;pointer-events:none;font-style:normal;font-size:9px;line-height:1;letter-spacing:.04em;font-weight:500;text-transform:uppercase;color:#fff;padding:3px 6px;border-radius:99px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.gb-w{background:#b8456f}.gb-m{background:#3f6fa3}.gb-u{background:#75599c}
.brand .gb{position:static;display:inline-block;vertical-align:1px;margin-left:6px;font-size:10px;padding:3px 8px;box-shadow:none}
.wl-empty{padding:44px 20px;text-align:center;color:var(--ink-soft);background:var(--card);border:1px dashed var(--line);border-radius:14px;line-height:1.5}
.wl-empty b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px}
.mv{margin:14px 0 4px;padding:12px;background:var(--chip);border:1px solid var(--line);border-radius:12px}
.mv>p{margin:0 0 8px;font-size:13px;color:var(--ink-soft)}
.mv .mvrow{display:flex;flex-wrap:wrap;gap:8px}
.mv button{font:inherit;font-size:14px;border-radius:99px;padding:8px 18px;cursor:pointer;border:1px solid var(--brass);background:none;color:var(--ink)}
.mv button.pri{background:var(--brass);color:#2a1b16}
.mv button.ghost{border-color:var(--line);color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:calc(100vw - 32px);display:flex;gap:14px;align-items:center;background:var(--wood-deep);color:#f3e8df;border:1px solid var(--brass);padding:11px 16px;border-radius:99px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast button{background:none;border:0;color:var(--brass-soft);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow"><span id="cname"></span> · <span id="count"></span></div>
    <h1>Perfume Wardrobe</h1>
    <div class="tools"><div class="switch" role="group" aria-label="Choose wardrobe"><button type="button" data-c="mannu" aria-pressed="true">Mannu's</button><button type="button" data-c="nix" aria-pressed="false">Nix's</button><button type="button" data-c="wishlist" aria-pressed="false">Wishlist</button></div><button class="valbtn" id="valbtn" type="button">See wardrobe value</button><button class="valbtn" id="aboutbtn" type="button">About wardrobe</button></div>
  </header>
  <div class="cabinet" id="cabinet" aria-label="Perfume wardrobe"></div>
  <p class="hint"><span id="hinttxt">Tap a bottle to open its card. Drag a bottle to a new spot to rearrange (on a phone, press and hold first).</span><span id="resetw"></span></p>
</div>
<div class="scrim" id="scrim"></div>

function lyProf(p){
  const tot=p.accords.reduce((q,x)=>q+x[1],0)||1,a={};let hv=0,br=0,sw=0;
  p.accords.forEach(([k,v])=>{a[k]=(a[k]||0)+v/tot;if(HEAVY.has(k))hv+=v/tot;if(BRIGHT.has(k))br+=v/tot;if(SWEETY.has(k))sw+=v/tot});
  const ord=[];p.notes.forEach(x=>ord.push(nn(x)));const y=PYR[p.id];if(y)["top","mid","base"].forEach(t=>(y[t]||[]).forEach(x=>ord.push(nn(x))));
  const set=new Set(ord),ns={};set.forEach(k=>ns[k]=1);
  const lng=parseInt(p.longevity)||7;
  return{p,a,ord:[...set],ns,set,br,sw,h:hv+0.04*(lng-7)-0.4*br};
}
function lyPair(A,B){
  const ac=cosM(A.a,B.a),nc=cosM(A.ns,B.ns);
  const shN=A.ord.filter(k=>B.set.has(k)),shA=Object.keys(A.a).filter(k=>B.a[k]).sort((x,y)=>(A.a[y]+B.a[y])-(A.a[x]+B.a[x]));
  const harm=0.5*ac+0.5*Math.min(1,nc*2.5);
  const d=Math.abs(A.h-B.h),comp=Math.min(1,d/0.5);
  const bridge=shN.length>=2?1:shN.length===1?0.7:shA.length?0.4:0;
  let s=0.4*harm+0.3*comp+0.3*bridge;
  if(A.sw>0.4&&B.sw>0.4&&Math.min(A.h,B.h)>0.5)s*=0.7;
  if(ac>0.92)s*=0.8;
  const hi=A.h>=B.h?A:B,lo=hi===A?B:A;
  let why=[];
  if(shN.length)why.push("Both carry "+shN.slice(0,2).join(" and ")+".");else if(shA.length)why.push("Both lean "+shA[0].toLowerCase()+".");
  if(comp>=0.45){why.push(lo.br>=0.15?sname(lo.p)+" is brighter and lifts the richer "+sname(hi.p)+".":sname(hi.p)+" is the deeper one and anchors the pair.")}
  else why.push("Similar weight, so keep it to 1 spray of each.");
  return{a:A.p,b:B.p,s,first:comp>=0.2?hi.p:null,second:comp>=0.2?lo.p:null,why:why.join(" "),tier:s>=0.62?"Great match":s>=0.5?"Good match":"Worth a test"};
}
function lyAll(L){const P=L.map(lyProf),out=[];for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)out.push(lyPair(P[i],P[j]));return out.sort((x,y)=>y.s-x.s)}
function lyHtml(r,me){
  const t=(p)=>'<button type="button" class="ab-b'+(me&&p.id===me?' me':'')+'" data-id="'+p.id+'"><img src="'+p.img+'" alt=""><span>'+esc(sname(p))+'</span><em>'+(r.first?(p===r.first?'1st':'2nd'):'mix')+'</em></button>';
  return '<div class="ly"><div class="ly-p">'+t(r.a)+'<i class="plus">+</i>'+t(r.b)+'</div><div class="sg-f"><div class="t"><i style="width:'+Math.round(Math.min(1,r.s/0.8)*100)+'%"></i></div><span>'+r.tier+'</span></div><div class="sg-w">'+esc(r.why)+(r.first?' Spray '+esc(sname(r.first))+' first, then '+esc(sname(r.second))+'.':' Either order works.')+'</div></div>';
}
function lySection(p){
  const L=list();if(L.length<2||!L.some(x=>x.id===p.id))return '';
  const P=L.map(lyProf),me=P.find(x=>x.p.id===p.id);
  const rs=P.filter(x=>x!==me).map(x=>lyPair(me,x)).sort((x,y)=>y.s-x.s).slice(0,3);
  return '<section><h3>Layers well with</h3><p class="ab-sub">From '+(active==='wishlist'?'your wishlist':esc(COLLECTIONS[active].who)+' wardrobe')+'. Heavier one first, lighter on top, 1–2 sprays each. Tap a bottle to open it.</p>'+rs.map(r=>lyHtml(r,p.id)).join("")+'<div class="src">A rule of thumb from shared notes, accords and weight. Always test a new pairing on skin first.</div></section>';
}
function lyAbout(L){
  if(L.length<2)return '';
  const all=lyAll(L),cnt={},pick=[];
  all.forEach(r=>{if(pick.length>=6)return;if((cnt[r.a.id]||0)>=2||(cnt[r.b.id]||0)>=2)return;cnt[r.a.id]=(cnt[r.a.id]||0)+1;cnt[r.b.id]=(cnt[r.b.id]||0)+1;pick.push(r)});
  return '<section><h3>Layering ideas</h3><p class="ab-sub">The best pairs from this wardrobe, by shared notes and how well their weights balance. Heavier one first, lighter on top, 1–2 sprays each.</p>'+pick.map(r=>lyHtml(r)).join("")+'<div class="src">Each bottle appears at most twice here. Open any bottle to see its own best partners. Test on skin before committing to a pairing.</div></section>';
}

function mvHtml(p){

function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button">Undo</button>':'');
  document.body.appendChild(t);
  if(undo)t.querySelector("button").onclick=()=>{undo();t.remove()};
  setTimeout(()=>t.remove(),6500);
}

     '<div class="ab-picks"><span>Your top 5</span>'+S.picks.map((p,i)=>'<button type="button" class="ab-b" data-id="'+p.id+'"><img src="'+p.img+'" alt=""><span>'+esc(p.short.join(" ").trim())+'</span><em>#'+(i+1)+'</em></button>').join("")+'</div>'+
     '<div class="ab-sug">'+S.top.map((r,i)=>{const c=r.c,dots=c[5].slice(0,3).map(a=>'<i style="background:'+(ACC[a[0]]||"#8a6a4a")+'" title="'+esc(a[0])+'"></i>').join("");
      return '<div class="sg"><div class="sg-n">'+(i+1)+'</div><div class="sg-b"><div class="sg-t"><b>'+esc(c[1])+'</b><span>'+esc(c[2])+' · '+c[4].toFixed(1)+'★</span></div>'+
      '<div class="sg-f"><div class="t"><i style="width:'+r.fit+'%"></i></div><span>'+r.fit+'% fit</span><div class="dots">'+dots+'</div></div>'+
      '<div class="sg-w">'+(r.sharedA.length?'Shares your '+r.sharedA.map(x=>x.toLowerCase()).join(' and ')+' accords. ':'')+(r.sharedN.length?'Notes you like: '+r.sharedN.map(cap).join(', ')+'. ':'')+'Closest to your #'+r.nearRank+' ('+esc(r.near.short.join(" ").trim())+').</div>'+
      '<a class="sg-l" target="_blank" rel="noopener" href="https://www.fragrantica.com/search/?query='+encodeURIComponent(c[1]+' '+c[2])+'">Look up on Fragrantica ↗</a></div></div>'}).join("")+'</div>'+
     '<div class="src">Candidates are popular perfumes, never ones from the same line as a bottle you already own, with their Fragrantica accords and notes, matched against your whole shelf. A suggestion is only a nudge on taste, not a buying recommendation.</div></section>'})()+
   lyAbout(L)+
   (gaps.length?'<section><h3>What is missing</h3><p>Under 12% of the accord mix: '+(gaps.length>1?gaps.slice(0,-1).join(", ")+" and "+gaps[gaps.length-1]:gaps[0])+'. Worth a look if you ever want a change of direction.</p></section>':'')+
   '<div class="src">Worked out from the Fragrantica data stored for each bottle, so it updates as you add bottles.</div>';
  $("#sheet").classList.add("on");$("#scrim").classList.add("on");$("#close").onclick=shut;$("#close").focus();
  $("#sheetIn").onclick=function(e){
   const bb=e.target.closest(".ab-b");if(bb){const p=list().find(x=>x.id===bb.dataset.id);if(p){open(p);const b=document.createElement("button");b.className="back";b.type="button";b.textContent="\u2190 Back to About";b.onclick=openAbout;$("#sheetIn").insertBefore(b,$("#sheetIn").children[1]);$("#sheet").scrollTop=0}return}
   const el=e.target.closest("[data-g]");if(!el)return;
   const anchor=el.parentElement.classList.contains("dn")?el.parentElement:el;
   const nx=anchor.nextElementSibling,same=nx&&nx.classList.contains("ab-pop")&&nx.dataset.for===el.dataset.g;
   document.querySelectorAll("#sheetIn .ab-pop").forEach(x=>x.remove());document.querySelectorAll("#sheetIn button.on").forEach(x=>x.classList.remove("on"));
   if(same)return;
   const pop=document.createElement("div");pop.className="ab-pop";pop.dataset.for=el.dataset.g;
   pop.innerHTML=(G[el.dataset.g]||[]).map(r=>'<button type="button" class="ab-b" data-id="'+r.p.id+'"><img src="'+r.p.img+'" alt=""><span>'+esc(r.p.short.join(" ").trim())+'</span>'+(r.t?'<em>'+r.t+'</em>':'')+'</button>').join("");
   anchor.after(pop);if(el.tagName==="BUTTON")el.classList.add("on");
  };
}
function shut(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
let suppress=false;
(function(){
  let st=null;
  const cellAt=(x,y)=>{const els=document.elementsFromPoint(x,y);for(const el of els){const c=el.closest&&el.closest("[data-idx]");if(c&&cab.contains(c))return c}return null};
  const clear=()=>{cab.querySelectorAll(".drop-t").forEach(n=>n.classList.remove("drop-t"))};
  const begin=()=>{
    st.on=true;document.body.classList.add("is-dragging");
    const g=document.createElement("img");g.className="drag-ghost";g.src=st.src;g.style.left=st.x+"px";g.style.top=st.y+"px";document.body.appendChild(g);st.g=g;
    cab.querySelectorAll('[data-idx="'+st.from+'"]').forEach(n=>n.classList.add("dragging"));
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  };
  const move=e=>{
    if(!st||e.pointerId!==st.pid)return;st.x=e.clientX;st.y=e.clientY;
    if(!st.on){
      const d=Math.hypot(e.clientX-st.sx,e.clientY-st.sy);
      if(st.type==="mouse"){if(d>6)begin()}else if(d>10){cancel();return}
    }
    if(st.on){st.g.style.left=e.clientX+"px";st.g.style.top=e.clientY+"px";clear();const c=cellAt(e.clientX,e.clientY);if(c&&+c.dataset.idx!==st.from)cab.querySelectorAll('[data-idx="'+c.dataset.idx+'"]').forEach(n=>n.classList.add("drop-t"));e.preventDefault()}
  };
  const tm=e=>{if(st&&st.on)e.preventDefault()};
  const cancel=()=>{if(!st)return;clearTimeout(st.t);if(st.g)st.g.remove();clear();cab.querySelectorAll(".dragging").forEach(n=>n.classList.remove("dragging"));document.body.classList.remove("is-dragging");document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",cancel);document.removeEventListener("touchmove",tm);st=null};
  const up=e=>{
    if(!st||e.pointerId!==st.pid)return;
    if(st.on){
      const c=cellAt(e.clientX,e.clientY);const a=ids();
      if(c){let to=Math.min(+c.dataset.idx,a.length-1);if(to!==st.from){const[m]=a.splice(st.from,1);a.splice(to,0,m);saveOrder(a);suppress=true;setTimeout(()=>suppress=false,0);cancel();build();return}}
      suppress=true;setTimeout(()=>suppress=false,0)
    }
    cancel();
  };
  cab.addEventListener("pointerdown",e=>{
    if(e.button>0)return;const b=e.target.closest("button[data-idx]");if(!b)return;
    const from=+b.dataset.idx,p=PERFUMES.find(q=>q.id===b.dataset.id);
    st={pid:e.pointerId,type:e.pointerType||"mouse",from,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,src:p.img,on:false};
    if(st.type!=="mouse"){st.t=setTimeout(()=>{if(st)begin()},320)}
    document.addEventListener("pointermove",move,{passive:false});document.addEventListener("pointerup",up);document.addEventListener("pointercancel",cancel);document.addEventListener("touchmove",tm,{passive:false});
  });
  cab.addEventListener("dragstart",e=>e.preventDefault());
  cab.addEventListener("contextmenu",e=>{if(st&&st.on)e.preventDefault()});
})();
cab.addEventListener("click",e=>{if(suppress){e.preventDefault();return}const b=e.target.closest("button[data-id]");if(b)open(PERFUMES.find(p=>p.id===b.dataset.id))});
$("#scrim").onclick=shut;
$("#valbtn").onclick=openValue;$("#aboutbtn").onclick=openAbout;
document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{active=b.dataset.c;try{localStorage.setItem("wardrobe",active)}catch(e){}shut();build();window.scrollTo(0,0)});
$("#sheetIn").addEventListener("click",e=>{const b=e.target.closest("[data-reveal]");if(b){b.hidden=true;b.nextElementSibling.hidden=false}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
build();
</script>
<script>
/* Android back button closes the open sheet instead of exiting the app */
(function(){var sh=document.getElementById("sheet"),pushed=false,skip=false;
new MutationObserver(function(){var on=sh.classList.contains("on");
 if(on&&!pushed){pushed=true;history.pushState({sheet:1},"")}
 else if(!on&&pushed){pushed=false;skip=true;history.back()}}).observe(sh,{attributes:true,attributeFilter:["class"]});
window.addEventListener("popstate",function(){if(skip){skip=false;return}if(sh.classList.contains("on")){pushed=false;shut()}});})();
</script>
